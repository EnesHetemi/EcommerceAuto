<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: page_head(${pageTitle}, 'none')" />
<body>
<div class="container-fluid">
	<div th:replace="navigation :: menu"></div>


<div class="mt-4 shadow p-3 mb-5 bg-white rounded">
	<div class="mt-4 font-weight-bold text-center text-info">
		<h2>[[${pageTitle}]]</h2>
	</div>
	<div>&nbsp;</div>

	<form th:action="@{/address_book/save}" method="post" th:object="${address}"
		style="max-width: 600px; margin: 0 auto">
		<input type="hidden" th:field="*{id}" />
		<input type="hidden" th:field="*{defaultForShipping}" />	
	<div class="shadow p-3 mb-5 bg-white rounded">			
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Emri:</label>
			<div class="col-sm-8">
				<input type="text" th:field="*{firstName}" class="form-control shadow-sm bg-light rounded"
					required="required" maxlength="45" minlength="2" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Mbiemri:</label>
			<div class="col-sm-8">
				<input type="text" th:field="*{lastName}" class="form-control shadow-sm bg-light rounded"
					required="required" maxlength="45" minlength="2" />
			</div>
		</div>				

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Numri i Telefonit:</label>
			<div class="col-sm-8">
				<input type="text" th:field="*{phoneNumber}" class="form-control shadow-sm bg-light rounded"
					required="required" maxlength="15" minlength="8" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Adresa 1:</label>
			<div class="col-sm-8">
				<input type="text" th:field="*{addressLine1}" class="form-control shadow-sm bg-light rounded"
					required="required" maxlength="64" minlength="3" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Adresa 2:</label>
			<div class="col-sm-8">
				<input type="text" th:field="*{addressLine2}" class="form-control shadow-sm bg-light rounded"
					maxlength="64" />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Qyteti:</label>
			<div class="col-sm-8">
				<input type="text" th:field="*{city}" class="form-control shadow-sm bg-light rounded"
					required maxlength="45" minlength="2" />
			</div>
		</div>
		
		<div class="form-group row" hidden>
	        <label class="col-sm-4 col-form-label">Kodi:</label>
	        <div class="col-sm-8">
		      <select th:field="*{code}" class="form-control shadow-sm bg-light rounded" required>
			     <option th:value="AL" selected>AL</option>
		      </select>
	         </div>
         </div>

		<div class="text-center">
			<input type="submit" value="Ruaj" class="btn btn-primary shadow rounded" />
		</div>
	</div>
	</form>
	</div>

	<div>&nbsp;</div>	
	<div th:replace="fragments :: footer"></div>
</div>

<script type="text/javascript">
	contextPath = "[[@{/}]]";
</script>

</body>
</html>
