<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: metaetj" />
<body>
<div class="container-fluid">
	<div th:replace="navigation :: menu"></div>
    
	<div class="text-center">
		<h2 class="mt-4 font-weight-bold text-info">Adresat Tuaja</h2>
		
		<div class="text-info">
			<a th:href="@{/address_book/new}" class="h4">Shto Adres te re</a>
		</div>
	</div>
	
	<div th:if="${message != null}" class="alert alert-success text-center m-1">
		[[${message}]]
	</div>	

	<div class="row m-1">
		<div class="col-sm-6 mt-2">
			<div class="card" th:classappend="${usePrimaryAddressAsDefault ? 'bg-success' : ''}">
				<div class="card-header">
					<div class="row">
						<div class="col">
							<b>Adresa juaj Primare</b>
							<th:block th:if="${usePrimaryAddressAsDefault}">
							<span class="text-danger">[E paracaktuar]</span>
							</th:block>

							<th:block th:unless="${usePrimaryAddressAsDefault}">
							<a th:href="@{'/address_book/default/0'}">[Vendose si paresore]</a>
							</th:block>
						</div>
						<div class="col">
							<div class="float-right">
								<a class="text-info" title="Ndryshoni adresën tuaj kryesore"
									th:href="@{/account_details(redirect=address_book)}">Ndrysho</a>
							</div>
						</div>
					</div>
				</div>
				<div class="card-body">
					[[${customer.address}]]
				</div>
			</div>
		</div>

		<th:block th:each="address, status: ${listAddresses}">
		<div class="col-sm-6 mt-2">
			<div class="card" th:classappend="${address.defaultForShipping ? 'bg-success' : ''}">
				<div class="card-header">
					<div class="row">
						<div class="col">
							<b>Adresa #[[${status.count + 1}]]</b>
							
							<th:block th:if="${address.defaultForShipping}">
							<span class="text-danger">[E paracaktuar]</span>
							</th:block>

							<th:block th:unless="${address.defaultForShipping}">
							<a th:href="@{'/address_book/default/' + ${address.id}}">[Vendose si paresore]</a>
							</th:block>
						</div>
						<div class="col">
							<div class="float-right">
								<a class="text-info" title="Ndrysho këtë adresë"
									th:href="@{'/address_book/edit/' + ${address.id}}">Ndrysho</a>
								&nbsp;
								<a class="text-info linkDelete" title="Fshije këtë adresë"
									th:entityId="${address.id}"
									th:href="@{'/address_book/delete/' + ${address.id}}">Fshije</a>									
							</div>
						</div>
					</div>
				</div>
				<div class="card-body">
					[[${address}]]
				</div>
			</div>
		</div>		
		</th:block>		
	</div>
	<div>&nbsp;</div>
	<div th:replace="fragments :: footer"></div>
	<div th:replace="fragments :: confirm_modal"></div>
</div>	


<script type="text/javascript">
	$(document).ready(function() {
		$(".linkDelete").on("click", function(evt) {
			evt.preventDefault();
			showDeleteConfirmModal($(this), 'address');
		});
	});

	function showDeleteConfirmModal(link, entityName) {
		entityId = link.attr("entityId");

		$("#yesButton").attr("href", link.attr("href"));	
		$("#confirmText").text("Jeni të sigurt që dëshironi ta fshini këtë "
								 + entityName + " ID " + entityId + "?");
		$("#confirmModal").modal();	
	}	
</script>
</body>
</html>
