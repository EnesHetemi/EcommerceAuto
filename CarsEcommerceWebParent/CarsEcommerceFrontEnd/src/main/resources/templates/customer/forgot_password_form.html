<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: page_head('Forgot Password', 'none')" />
<body>
<div class="container-fluid text-center">
	<div th:replace="navigation :: menu"></div>
	<div class="mt-4 font-weight-bold text-center text-info">
		<h2>Keni harruar fjalëkalimin</h2>
	</div>

	<form th:action="@{/forgot_password}" method="post" style="max-width: 460px; margin: 0 auto">
	<div th:if="${error != null}">
		<p class="text-danger">[[${error}]]</p>
	</div>
	<div th:if="${message != null}">
		<p class="text-warning">[[${message}]]</p>
	</div>	
	<div class="mt-4 shadow rounded p-3">
		<div>
			<p>Ne do të dërgojmë një lidhje të rivendosjes së fjalëkalimit në emailin tuaj.</p>
		</div>
		<div>
			<p>
				<input type="email" name="email" class="form-control shadow-sm bg-light rounded" placeholder="Shkruani emailin tuaj" 
					required="required" autofocus="autofocus" />
			</p>
		</div>
		<div>
			<p>
				<input type="submit" value="Dërgo" class="btn btn-primary shadow rounded" />
			</p>
		</div>
	</div>
	</form>

	<div th:replace="fragments :: footer"></div>
</div>	
</body>
</html>
