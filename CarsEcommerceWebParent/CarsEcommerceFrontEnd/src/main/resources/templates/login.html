<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: page_head('Kyqu - Ecommerce', 'none')" />
<body class="container-fluid">

<div th:replace="navigation :: menu"></div>

<div th:replace="fragments :: message" />

    <div class="mt-4 navbar-brand d-flex justify-content-center">
		<img style="width:200px; height:150px;" th:src="@{/images/llogo.jpg}" />
	</div>
	
	<div class="mt-4 d-flex justify-content-center">
		<a class="btn btn-lg btn-secondary shadow-sm rounded" th:href="@{/oauth2/authorization/google}">&nbsp;&nbsp;Continue with Google</a>
	</div>

	<form th:action="@{/login}" method="post" style="max-width: 400px; margin:0 auto;">
	    <div th:if="${param.error}">
			<p class="mt-4 text-center text-danger">[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]</p>
		</div>
		
		<div th:if="${param.logout}">
			<p class="mt-4 text-center text-warning">Ju keni dalë nga llogaria.</p>
		</div>
		<div class="mt-4 shadow p-3 mb-5 bg-white rounded">
			<p class="font-weight-bold text-center text-info">Kyqu për Auto Pjesë</p>
			<p>
				<input type="email" name="email" class="form-control shadow-sm bg-light rounded" placeholder="E-mail" required />
			</p>
			<p>
				<input type="password" name="password" class="form-control shadow-sm bg-light rounded" placeholder="Password" required />
			</p>
			
			<div class="mt-4 text-center">
               <span>Nuk jeni te regjistruar, regjistrohuni: <a class="shadow-sm bg-light rounded" th:href="@{/register}">Regjistrohu</a></span>
            </div>
        
			<p class="mt-3 d-flex justify-content-center text-info">
				<input class="shadow-sm rounded" type="checkbox" name="remember-me" />&nbsp;Më Kujto
			</p>
			<p class="d-flex justify-content-center">
				<input type="submit" value="Login" class="btn btn-primary shadow-sm rounded" />
			</p>			
		</div>
	</form>
	
	<div th:replace="fragments :: footer"></div>
	
</body>
</html>
