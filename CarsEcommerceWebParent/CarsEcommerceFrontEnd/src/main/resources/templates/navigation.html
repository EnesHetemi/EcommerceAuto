<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
<div th:fragment="menu">
	<div>
	   <th:block sec:authorize="isAuthenticated()">	
		<form th:action="@{/logout}" method="post" th:hidden="true" name="logoutForm">
			<input type="submit" value="Logout" />
		</form>
		</th:block>
		<nav class="navbar navbar-expand-lg bg-light navbar-secondary">
			<a class="navbar-brand" th:href="@{/}">
				<img style="width:80px; height:50px;" th:src="@{/images/llogo.jpg}" />
			</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#topNavbar">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="topNavbar">
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link" th:href="@{/products}">Produktet</a>
					</li>
					
					<th:block sec:authorize="!isAuthenticated()">
					<li class="nav-item">
						<a class="nav-link" th:href="@{/login}">Kyqu</a>
					</li>
					
					<li class="nav-item">
						<a class="nav-link" th:href="@{/register}">Regjistrohu</a>
					</li>
					</th:block>
					
					<th:block sec:authorize="isAuthenticated()">
					<li class="nav-item">
						<a class="nav-link" th:href="@{/cart}">Shporta</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/address_book}">Adresat</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/account_details}"
							sec:authentication="principal.fullName"></a>
					</li>	
					
					<li class="nav-item">
						<a class="nav-link" href="javascript: document.logoutForm.submit()">Logout</a>
					</li>
					</th:block>
				</ul>
			</div>
			
		</nav>
	
</div>

</body>
</html>
