<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
	<form th:action="@{/settings/save_general}" method="post" enctype="multipart/form-data">
	<div class="form-group row">
		<label class="col-sm-4 col-form-label">Emri Kryesor:</label>
		<div class="col-sm-8">
			<input type="text" class="form-control shadow-sm bg-light rounded" name="SITE_NAME" 
				th:value="${SITE_NAME}" required  />
		</div>
	</div>	

	<div class="form-group row">
		<label class="col-sm-4 col-form-label">Copyright:</label>
		<div class="col-sm-8">
			<input type="text" class="form-control shadow-sm bg-light rounded" name="COPYRIGHT" 
				th:value="${COPYRIGHT}" required  />
		</div>
	</div>

	<div class="form-group row">
		<label class="col-sm-4 col-form-label">Logo Kryesore:</label>
		<div class="col-sm-8 shadow-sm bg-light rounded">
			<img id="thumbnail" alt="Llogo" th:src="@{${SITE_LOGO}}"
				width="150" height="70"/>
			<input type="file" id="fileImage" name="fileImage" accept="image/png, image/jpeg" />

		</div>
	</div>	

	<div class="text-center">
		<input type="submit" value="Ruaj" class="btn btn-primary m-3 shadow rounded" />
	</div>	
	</form>
</div>
</body>
</html>
