<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<head th:replace="fragments :: page_head('Settings - Ecommerce Admin', 'tag')" />
	<link rel="stylesheet" th:href="@{/richtext/richtext.min.css}" />
	<script th:src="@{/richtext/jquery.richtext.min.js}"></script>
</head>
<body>
<div class="container-fluid">
	<div th:replace="navigation :: menu"></div>
	<div class="mt-4 font-weight-bold text-center text-info">
		<h2>Settings</h2>	
	</div>

	<div th:if="${message != null}" class="mt-3 alert alert-success text-center">
		[[${message}]]
	</div>

	<div class="mt-4 shadow rounded">
		<ul class="nav nav-tabs" id="settingTab" role="tablist">
		  <li class="nav-item">
		    <a class="nav-link active shadow-sm rounded" data-toggle="tab" href="#general" role="tab">Të Përgjithshme</a>
		  </li>
		  <li class="nav-item">
		    <a class="nav-link shadow-sm rounded" data-toggle="tab" href="#mailServer" role="tab">Mail Server</a>
		  </li>
		  <li class="nav-item">
		    <a class="nav-link shadow-sm rounded" data-toggle="tab" href="#mailTemplate" role="tab">Mail Templates</a>
		  </li>		  
		  <li class="nav-item">
		    <a class="nav-link shadow-sm rounded" data-toggle="tab" href="#payment" role="tab">Paypal</a>
		  </li>	
		</ul>

		<div class="tab-content">
		  <div class="tab-pane active p-3" id="general" role="tabpanel">
		  	<div th:replace="settings/general :: content" />
		  </div>
		  <div class="tab-pane p-3" id="mailServer" role="tabpanel">
			<div th:replace="settings/mail_server :: content"></div>
		  </div>
		  <div class="tab-pane p-3" id="mailTemplate" role="tabpanel">
			<div th:replace="settings/mail_templates/mail_templates :: content"></div>
		  </div>	
		  <div class="tab-pane p-3" id="payment" role="tabpanel">
			<div th:replace="settings/payment :: content"></div>
		  </div>
		 </div>
	</div>


	<div th:replace="fragments :: footer"></div>

</div>
<script type="text/javascript">
	MAX_FILE_SIZE = 102400; // 100KB
	
	$(document).ready(function() {
		$("#customerVerificationContent").richText();
		$("#orderConfirmationContent").richText();
	});
</script>
<script th:src="@{/js/common_form.js}"></script>
</body>
</html>
