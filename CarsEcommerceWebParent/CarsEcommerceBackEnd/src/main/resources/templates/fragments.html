<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="page_head(title, remove)" th:remove="${remove}">
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0, minimum-scale=1.0">

	<title>[[${title}]]</title>

	<link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/fontawesome/all.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
	<script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}" ></script>
	<script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.min.js}" ></script>
</head>
<body>

<th th:fragment="column_link(moduleURL, fieldName, columnLabel, removeTag)" th:remove="${removeTag}">
		<a class="text-white"
			th:href="@{${moduleURL} + '/page/' + ${currentPage} + '?sortField=' + ${fieldName}  +'&sortDir=' + ${sortField != fieldName ? sortDir : reverseSortDir} + ${keyword != null ? '&keyword=' + keyword : ''}}">
			[[${columnLabel}]]
		</a>								
		<span th:if="${sortField == fieldName}"
			th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}" ></span>					
	</th>

<div th:fragment="edit(entityName, editURL)" th:remove="tag">
		<a th:href="@{${editURL}}"
			th:title="'Edit this ' + ${entityName}"><button type="button" class="btn btn-success shadow rounded">Edit</button></a>
	</div>
	
	<div th:fragment="delete(entityName, entityId, deleteURL, visible)" th:remove="tag">
		<th:block th:if="${visible}">		
		<a class="link-delete" th:href="@{${deleteURL}}"
			th:entityId="${entityId}"
			th:title="'Delete this ' + ${entityName}"><button type="button" class="btn btn-danger shadow rounded">Delete</button></a>
		</th:block>	
	</div>
	
	<div th:fragment="status(enabled, entityName, entityURL)" th:remove="tag">
		<a th:if="${enabled == true}" 
			th:href="@{${entityURL} + '/enabled/false'}"
			th:title="'Çaktivizo këtë ' + ${entityName}"
			><button type="button" class="btn btn-info shadow rounded">Aktiv</button></a>
			
		<a th:if="${enabled == false}" 
			th:href="@{${entityURL} + '/enabled/true'}"
			th:title="'Aktivizo këtë ' + ${entityName}"
			><button type="button" class="btn btn-danger shadow rounded">Deaktiv</button></a>	
	</div>
	
		<!-- <a th:fragment="page_link(pageNum, label)"
		class="page-link" 
		th:href="@{${moduleURL} + '/page/' + ${pageNum} + '?'  + ${keyword != null ? '&keyword=' + keyword : ''}}">[[${label}]]</a> -->

        <a th:fragment="page_link(pageNum, label)"
		class="page-link" 
		th:href="@{${moduleURL} + '/page/' + ${pageNum} + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir} + ${keyword != null ? '&keyword=' + keyword : ''}}">[[${label}]]</a>

   <div th:fragment="pagination(entityName)" th:remove="tag">
	<div class="text-center m-1" th:if="${totalItems > 0}">
		<span>Showing [[${entityName}]] # [[${startCount}]] to [[${endCount}]] of [[${totalItems}]]</span>
	</div>
	<div class="text-center m-1" th:unless="${totalItems > 0}">
		<span>No [[${entityName}]] found</span>
	</div>
	
	<div th:if="${totalPages > 1}">
		<nav>
		  <ul class="pagination justify-content-center flex-wrap">
		    <li th:class="${currentPage > 1 ? 'page-item' : 'page-item disabled'}">
		    	<a th:replace="fragments :: page_link(1, 'First')"></a>
		    </li>		  
		    <li th:class="${currentPage > 1 ? 'page-item' : 'page-item disabled'}">
		    	<a th:replace="fragments :: page_link(${currentPage - 1}, 'Previous')"></a>
		    </li>
		    
		    <li th:class="${currentPage != i ? 'page-item': 'page-item active'}" 
		    	th:each="i : ${#numbers.sequence(1, totalPages)}">
		    	<a th:replace="fragments :: page_link(${i}, ${i})"></a>
		    </li>
		    
		    <li th:class="${currentPage < totalPages ? 'page-item' : 'page-item disabled'}">
		    	<a th:replace="fragments :: page_link(${currentPage + 1}, 'Next')"></a>
		    </li>
		    
		    <li th:class="${currentPage < totalPages ? 'page-item' : 'page-item disabled'}">
		    	<a th:replace="fragments :: page_link(${totalPages}, 'Last')"></a>
		    </li>		    
		  </ul>
		</nav>	
	</div>		
	</div>

<div th:fragment="search_form(moduleURL)" class="d-flex justify-content-center">
		<form th:action="@{${moduleURL}}" class="form-inline m-3">
		
		<input type="hidden" name="sortField" th:value="${sortField}" />
			<input type="hidden" name="sortDir" th:value="${sortDir}" />

			<input type="search" name="keyword" th:value="${keyword}" class="form-control shadow bg-white rounded" required/>
			&nbsp;&nbsp;
			<input type="submit" value="Search" class="btn btn-primary shadow rounded" />
			&nbsp;&nbsp;
			<input type="button" value="Clear" class="btn btn-secondary shadow rounded" onclick="clearFilter()" />
		</form>
	</div>
	
	<div th:fragment="message()" th:if="${message != null}" class="mt-4 alert alert-success text-center">
		    [[${message}]]
    </div>

    <div th:fragment="footer" class="text-center m-3 shadow rounded">
		<p>Ecommerce Auto Parts Control Panel - Copyright &copy; Ecommerce Auto Parts</p>
	</div>

</body>
</html>
