<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: metaetj" />
<body>

<div th:replace="navigation :: menu"></div>


     <div class="mt-4 font-weight-bold text-center text-info">
		<h2>[[${pageTitle}]]</h2>	
	</div>

	<form th:action="@{/account/update}" method="post" style="max-width: 700px; margin: 0 auto"
		enctype="multipart/form-data" th:object="${user}">
		<input type="hidden" th:field="*{id}" />
	<div class="mt-4 shadow p-3 mb-5 bg-white rounded">
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Email:</label>
			<div class="col-sm-8">
				<input type="email" class="form-control shadow-sm bg-light rounded" th:field="*{email}" readonly="readonly"  />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Emri:</label>
			<div class="col-sm-8">
				<input type="text" class="form-control shadow-sm bg-light rounded" th:field="*{firstName}" required minlength="2" maxlength="45"  />
			</div>
		</div>		

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Mbiemri:</label>
			<div class="col-sm-8">
				<input type="text" class="form-control shadow-sm bg-light rounded" th:field="*{lastName}" required minlength="2" maxlength="45"  />
			</div>
		</div>		
			
		
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Password:</label>
			<div class="col-sm-8">
				<input type="password" th:field="*{password}" class="form-control shadow-sm bg-light rounded"
					placeholder="Lëre bosh nëse nuk dëshiron të ndryshosh fjalëkalimin"
					minlength="8" maxlength="20"
					oninput="checkPasswordMatch(document.getElementById('confirmPassword'))"
				  />
			</div>
		</div>
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Confirm Password:</label>
			<div class="col-sm-8">
				<input type="password" id="confirmPassword" class="form-control shadow-sm bg-light rounded"
					minlength="8" maxlength="20"
					oninput="checkPasswordMatch(this)"			
				  />
			</div>
		</div>	

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Roli:</label>
			<div class="col-sm-8">
				<span><b>[[${user.roles}]]</b></span>
			</div>
		</div>
		
		
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Foto:</label>
			<div class="col-sm-8">
				<input type="hidden" th:field="*{photos}" />
				<input type="file" id="fileImage" name="image" accept="image/png, image/jpeg"
					class="mb-2 shadow-sm bg-light rounded" />
				<img id="thumbnail" alt="Photos preview" th:src="@{${user.photosImagePath}}"
					class="img-fluid shadow p-3 mb-5 bg-light rounded" />
			</div>
		</div>		

		<div class="text-center">
			<input type="submit" value="Ruaj" class="btn btn-primary m-3 shadow rounded" />
			<input type="button" value="Anulo" class="btn btn-secondary shadow rounded" id="buttonCancel" />
		</div>
	</div>
	</form>
	
	<div th:replace="modal_fragment :: modal_dialog"></div>
    
    <div th:replace="fragments :: footer"></div>

</div>
	
<script th:src="@{/js/common_form.js}"></script>
<script type="text/javascript">
MAX_FILE_SIZE = 102400; // 100KB
moduleURL = "[[@{/user}]]";
	
function checkPasswordMatch(confirmPassword) {
	if (confirmPassword.value != $("#password").val()) {
		confirmPassword.setCustomValidity("Fjalëkalimet nuk përputhen!");
	} else {
		confirmPassword.setCustomValidity("");
	}
}

</script>
</body>
</html>
