<!DOCTYPE html>
<html>
<head th:replace="fragments :: page_head('Markat - Ecommerce Admin', 'none')" />
<body>

<div th:replace="navigation :: menu"></div>

<div class="mt-4 " style="margin-left: 192px;">
    <a th:href="@{/brands/new}"><button type="button" class="btn btn-primary shadow mb-2 rounded">Shto Marken</button></a>
</div>

<div th:replace="fragments :: search_form('/brands/page/1')" />

<div th:replace="fragments :: message" />

<div class="text-center">
<div class="mt-3 full-details d-flex justify-content-center">
		<table class="table table-bordered table-striped table-hover table-responsive-xl w-75 shadow p-3 mb-5 bg-white rounded">
			<thead class="table-info">
				<tr>
					<th>Id</th>
					<th>Logo</th>
					<th>Emri</th>
					<th>Kategoria</th>
					<th>Veprime</th>
				</tr>								
			</thead>
			<tbody>
				<tr th:each="brand : ${listBrands}">
					<td>[[${brand.id}]]</td>
					<td><img th:src="@{${brand.logoPath}}" style="width: 100px" class="img-fluid"/></td>
					<td>[[${brand.name}]]</td>
					<td>
						<th:block th:each="cat : ${brand.categories}">
						<span class="badge badge-secondary shadow-sm rounded" th:text="${cat.name}"></span>
						</th:block>
					</td>

					<td>
						<div th:replace="fragments :: edit('brand', '/brands/edit/' + ${brand.id})" />
						| 
						<div th:replace="fragments :: delete('brand', ${brand.id}, '/brands/delete/' + ${brand.id}, true)" />			
					</td>					
				</tr>
			</tbody>
		</table>
	</div>
</div>

    <div th:replace="fragments :: pagination('brands')"></div>

    <div th:replace="modal_fragment :: confirm_modal" />
	
	<div th:replace="fragments :: footer"></div>
	
	<script th:src="@{/js/common_list.js}"></script>
<script type="text/javascript">
	moduleURL = "[[@{/brands}]]";
	
	entityName = "brand";

</script>
</body>
</html>
