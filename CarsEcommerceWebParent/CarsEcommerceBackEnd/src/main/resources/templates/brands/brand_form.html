<!DOCTYPE html>
<html>
<head th:replace="fragments :: metaetj" />
<body>

<div th:replace="navigation :: menu"></div>


     <div class="mt-4 font-weight-bold text-center text-info">
		<h2>[[${pageTitle}]]</h2>	
	</div>

	<form th:action="@{/brands/save}" method="post" style="max-width: 700px; margin: 0 auto"
		enctype="multipart/form-data" th:object="${brand}" onsubmit="return checkUnique(this)">
		<input type="hidden" th:field="*{id}" />
	<div class="mt-4 shadow p-3 mb-5 bg-white rounded">
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Emri:</label>
			<div class="col-sm-8">
				<input type="text" class="form-control shadow-sm p-3 mb-5 bg-white rounded" th:field="*{name}" required minlength="2" maxlength="128"  />
			</div>
		</div>	
		
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Image:</label>
			<div class="col-sm-8">
				<input type="hidden" th:field="*{logo}" />
				<input type="file" id="fileImage" name="fileImage" accept="image/png, image/jpeg"
					class="mb-2" />
				
				<div class="mt-2">
					<img id="thumbnail" alt="Image preview" th:src="@{${brand.logoPath}}"
						class="img-fluid" />
				</div>
			</div>
		</div>
		
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Select one or more categories:</label>
			<div class="col-sm-8">
				<select class="form-control" th:field="*{categories}" multiple required
						style="resize: vertical; height: 200px">
					<th:block th:each="cat : ${listCategories}">
					<option th:value="${cat.id}">[[${cat.name}]]</option>
					</th:block>

				</select>
			</div>
		</div>	
		
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Chosen categories:</label>
			<div class="col-sm-8">
                <div id="chosenCategories">
				</div>
			</div>
		</div>

		<div class="text-center">
			<input type="submit" value="Save" class="btn btn-primary m-3 shadow rounded" />
			<input type="button" value="Cancel" class="btn btn-secondary shadow rounded" id="buttonCancel" />
		</div>
	</div>
	</form>
	
	<div th:replace="modal_fragment :: modal_dialog"></div>
    
    <div th:replace="fragments :: footer"></div>

</div>
	
<script th:src="@{/js/common_form.js}"></script>
<script type="text/javascript">
moduleURL = "[[@{/categories}]]";

$(document).ready(function() {
	dropdownCategories = $("#categories");
	divChosenCategories = $("#chosenCategories");

	dropdownCategories.change(function() {
		divChosenCategories.empty();
		showChosenCategories();
	});
	showChosenCategories();
});

function showChosenCategories() {
	dropdownCategories.children("option:selected").each(function() {
		selectedCategory = $(this);
		catId = selectedCategory.val();
		catName = selectedCategory.text().replace(/-/g, "");

		divChosenCategories.append("<span class='badge badge-secondary m-1'>" + catName + "</span>");
	});

}


function checkUnique(form) {
	brandId = $("#id").val();
	brandName = $("#name").val();

	csrfValue = $("input[name='_csrf']").val();

	url = "[[@{/brands/check_unique}]]";

	params = {id: brandId, name: brandName, _csrf: csrfValue};

	$.post(url, params, function(response) {
		if (response == "OK") {
			form.submit();
		} else if (response == "Duplicate") {
			showWarningModal("Ekziston një markë tjetër me të njëjtin emër " + brandName);	
		} else {
			showErrorModal("Përgjigje e panjohur nga serveri");
		}

	}).fail(function() {
		showErrorModal("Nuk mund të lidhej me serverin");
	});

	return false;
}	

</script>

<script th:src="@{/js/common_form.js}"></script>
</body>
</html>
