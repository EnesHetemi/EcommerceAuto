<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: page_head('Konsumatorët - Ecommerce Admin', 'none')" />
<body>

<div th:replace="navigation :: menu"></div>

<div th:replace="fragments :: search_form('/customers/page/1')" />

<div th:replace="fragments :: message" />

<div class="text-center">
<div class="mt-3 full-details d-flex justify-content-center">
		<table class="table table-bordered table-striped table-hover table-responsive-xl w-75 shadow p-3 mb-5 bg-white rounded">
			<thead class="table-info">
				<tr>
                    <th th:replace="fragments :: column_link('/customers', 'firstName', 'Emri', 'none')" />
				    <th>Mbiemri</th>
                    <th>Email</th>
					<th th:replace="fragments :: column_link('/customers', 'createdTime', 'Data e Krijimit', 'none')" />
					<th>Aktivizimi</th>
					<th>Veprime</th>
				</tr>								
			</thead>
			<tbody>
				<tr th:each="customer : ${listCustomers}">
					<td><a class="link-detail" th:href="@{'/customers/detail/' + ${customer.id}}"
							title="Shikoni detajet e këtij konsumatori"
							>[[${customer.firstName}]]</a></td>
					<td>[[${customer.lastName}]]</td>
					<td>[[${customer.email}]]</td>
					<td>[[${customer.createdTime}]]</td>
					<td>
						<div th:replace="fragments :: status(${customer.enabled}, 'customer', '/customers/' + ${customer.id})" />
					</td>

					<td>
						<div th:replace="fragments :: delete('customer', ${customer.id}, '/customers/delete/' + ${customer.id}, true)" />				
					</td>					
				</tr>
			</tbody>
		</table>
	</div>
</div>

    <div th:replace="fragments :: pagination('customers')"></div>
    
    <div th:replace="modal_fragment :: confirm_modal" />
    
    <div class="modal fade" id="detailModal">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
			</div>
		</div>
	</div>
	
	<div th:replace="fragments :: footer"></div>
	
	<script th:src="@{/js/common_list.js}"></script>
<script type="text/javascript">
	moduleURL = "[[@{/customers}]]";
	
	$(".link-detail").on("click", function(e) {
		e.preventDefault();
		linkDetailURL = $(this).attr("href");
		$("#detailModal").modal("show").find(".modal-content").load(linkDetailURL);
	});
	
	entityName = "customer";
</script>
</body>
</html>
