<!DOCTYPE html>
<html>
<head th:replace="fragments :: metaetj" />
<body>

<div th:replace="navigation :: menu"></div>

<div class="mt-4 " style="margin-left: 192px;">
    <a th:href="@{/categories/new}"><button type="button" class="btn btn-primary shadow mb-2 rounded">Krijo Kategori</button></a>
</div>

<div th:replace="fragments :: search_form('/categories/page/1')" />

<div th:replace="fragments :: message" />

<div class="text-center">
<div class="mt-3 full-details d-flex justify-content-center">
		<table class="table table-bordered table-striped table-hover table-responsive-xl w-75 shadow p-3 mb-5 bg-white rounded">
			<thead class="table-info">
				<tr>
					<th>Id</th>
					<th>Foto</th>
					<th>Emri</th>
					<th>Pseudonimi</th>
					<th>Aktivizimi</th>
					<th>Veprime</th>
				</tr>								
			</thead>
			<tbody>
				<tr th:each="cat : ${listCategories}">
					<td>[[${cat.id}]]</td>
					<td>
						<img th:src="@{${cat.imagePath}}" style="width: 70px" class="img-fluid"/>
					</td>
					<td>[[${cat.name}]]</td>
					<td>[[${cat.alias}]]</td>
					<td>
						<div th:replace="fragments :: status(${cat.enabled}, 'category', '/categories/' + ${cat.id})" />
					</td>

					<td>
					    <div th:replace="fragments :: edit('category', '/categories/edit/' + ${cat.id})" />
						|
						<div th:replace="fragments :: delete('category', ${cat.id}, '/categories/delete/' + ${cat.id}, true)" />					
					</td>					
				</tr>
			</tbody>
		</table>
	</div>
</div>

    <div th:replace="fragments :: pagination('categories')"></div>
	
	<div th:replace="modal_fragment :: confirm_modal" />
	
	<div th:replace="fragments :: footer"></div>

<script th:src="@{/js/common_list.js}"></script>	
<script>
moduleURL = "[[@{/categories}]]";

entityName = "category";

$(document).ready(function() {
	$(".link-delete").on("click", function(e) {
		e.preventDefault();
		showDeleteConfirmModal($(this), 'category');
	});
});
</script>
</body>
</html>
