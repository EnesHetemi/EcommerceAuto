<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: metaetj" />
<body>

<div th:replace="navigation :: menu"></div>


     <div class="mt-4 font-weight-bold text-center text-info">
		<h2>[[${pageTitle}]]</h2>	
	</div>

	<form th:action="@{/categories/save}" method="post" style="max-width: 700px; margin: 0 auto"
		enctype="multipart/form-data" th:object="${category}" onsubmit="return checkUnique(this)">
		<input type="hidden" th:field="*{id}" />
	<div class="mt-4 shadow p-3 mb-5 bg-white rounded">
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Emri:</label>
			<div class="col-sm-8">
				<input type="text" class="form-control shadow-sm bg-light rounded" th:field="*{name}" required minlength="2" maxlength="128"  />
			</div>
		</div>

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Pseudonimi:</label>
			<div class="col-sm-8">
				<input type="text" class="form-control shadow-sm bg-light rounded" th:field="*{alias}" required minlength="2" maxlength="64"  />
			</div>
		</div>		

		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Aktivizimi:</label>
			<div class="col-sm-8">
				<input class="shadow-sm bg-light rounded" type="checkbox" th:field="*{enabled}" />
			</div>
		</div>	
		
		<div class="form-group row">
			<label class="col-sm-4 col-form-label">Foto:</label>
			<div class="col-sm-8">
				<input type="hidden" th:field="*{image}" />
				<input type="file" id="fileImage" name="fileImage" accept="image/png, image/jpeg"
					th:required="${category.imagePath == null}"
					class="mb-2 shadow-sm bg-light rounded" />
				
				<div class="mt-2">
					<img id="thumbnail" alt="Image preview" th:src="@{${category.imagePath}}"
						class="img-fluid shadow p-3 mb-5 bg-light rounded" />
				</div>
			</div>
		</div>	

		<div class="text-center">
			<input type="submit" value="Ruaj" class="btn btn-primary m-3 shadow rounded" />
			<input type="button" value="Anulo" class="btn btn-secondary shadow rounded" id="buttonCancel" />
		</div>
	</div>
	</form>
	
	<div th:replace="modal_fragment :: modal_dialog"></div>
    
    <div th:replace="fragments :: footer"></div>

</div>
	
<script th:src="@{/js/common_form.js}"></script>
<script type="text/javascript">
MAX_FILE_SIZE = 102400; // 100KB
moduleURL = "[[@{/categories}]]";
	
function checkUnique(form) {
	catId = $("#id").val();
	catName = $("#name").val();
	catAlias = $("#alias").val();

	csrfValue = $("input[name='_csrf']").val();

	url = "[[@{/categories/check_unique}]]";

	params = {id: catId, name: catName, alias: catAlias, _csrf: csrfValue};

	$.post(url, params, function(response) {
		if (response == "OK") {
			form.submit();
		} else if (response == "DuplicateName") {
			showWarningModal("Ekziston një kategori tjetër me të njëjtin emër " + catName);	
		} else if (response == "DuplicateAlias") {
			showWarningModal("Ekziston një kategori tjetër që ka të njëjtin pseudonim " + catAlias);
		} else {
			showErrorModal("Përgjigje e panjohur nga serveri");
		}

	}).fail(function() {
		showErrorModal("Nuk mund të lidhej me serverin");
	});

	return false;
}

</script>
</body>
</html>
