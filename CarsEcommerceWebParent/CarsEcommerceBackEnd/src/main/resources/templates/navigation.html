<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<body>
<div th:fragment="menu">
    <form th:action="@{/logout}" method="post" th:hidden="true" name="logoutForm">
		<input type="submit" />
	</form>
	<div>
		<nav class="navbar navbar-expand-lg bg-light navbar-secondary">
			<a class="navbar-brand" th:href="@{/}">
				<img style="width:80px; height:50px;" th:src="@{/images/llogo.jpg}" />
			</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#topNavbar">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="topNavbar">
				<ul class="navbar-nav">
					<li class="nav-item" sec:authorize="hasAuthority('Admin')">
						<a class="nav-link" th:href="@{/users}">Perdoruesit</a>
					</li>
					<li class="nav-item" sec:authorize="hasAnyAuthority('Admin', 'Editor')">
						<a class="nav-link" th:href="@{/categories}">Kategorit</a>
					</li>		
					<li class="nav-item" sec:authorize="hasAnyAuthority('Admin', 'Editor')">
						<a class="nav-link" th:href="@{/brands}">Markat</a>
					</li>
					<li class="nav-item" sec:authorize="hasAnyAuthority('Admin', 'Editor', 'Salesperson')">
						<a class="nav-link" th:href="@{/products}">Produktet</a>
					</li>
					<li class="nav-item" sec:authorize="hasAnyAuthority('Admin', 'Salesperson')">
						<a class="nav-link" th:href="@{/customers}">Konsumatoret</a>
					</li>					
					<li class="nav-item">
						<a class="nav-link" th:href="@{/orders}">Porosit</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/report}">Raporti i Shitjeve</a>
					</li>	
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" data-toggle="dropdown" th:href="@{/account}"
							sec:authentication="principal.fullname"></a>
						<div class="dropdown-menu">
							<a class="dropdown-item" id="logoutLink" href="">Logout</a>
						</div>
					</li>			
				</ul>
			</div>
			
		</nav>
	
</div>

<script th:src="@{/js/common.js}"></script>
</body>
</html>
