<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" th:remove="tag">
	<div>
		<button period="last_7_days" class="btn btn-primary button-sales-by-date m-1 shadow rounded">Periudha 7 Ditore</button>
		<button period="last_28_days" class="btn btn-light button-sales-by-date m-1 shadow rounded">Periudha 28 Ditore</button>
		<button period="last_6_months" class="btn btn-light button-sales-by-date m-1 shadow rounded">Periudha 6 Mujore</button>
		<button period="last_year" class="btn btn-light button-sales-by-date m-1 shadow rounded">Periudha 1 Vjeqare</button>
	</div>

	<div id="chart_sales_by_date" class="justify-content-center mt-3"></div>

	<div class="row justify-content-center">
		<div class="col-2-sm shadow-sm bg-light rounded">
			<div class="card">
				<div class="card-header"><b>Totali i Shitjeve</b></div>
				<div class="card-body">
					<span class="h3" id="textTotalGrossSales"></span>
				</div>
			</div>
		</div>	

		<div class="col-2-sm shadow-sm bg-light rounded">
			<div class="card">
				<div class="card-header"><b>Mesatarja e Shitjeve</b></div>
				<div class="card-body">
					<span class="h3" id="textAvgGrossSales"></span>
				</div>
			</div>
		</div>		

		<div class="col-2-sm shadow-sm bg-light rounded">
			<div class="card">
				<div class="card-header"><b>Totali i Porosive</b></div>
				<div class="card-body">
					<span class="h3" id="textTotalOrders"></span>
				</div>
			</div>
		</div>		
	</div>
</div>
</body>
</html>
