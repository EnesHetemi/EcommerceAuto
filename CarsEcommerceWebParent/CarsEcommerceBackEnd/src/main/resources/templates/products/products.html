<!DOCTYPE html>
<html>
<head th:replace="fragments :: metaetj" />
<body>

<div th:replace="navigation :: menu"></div>

<div class="mt-4 " style="margin-left: 192px;">
    <a th:href="@{/products/new}"><button type="button" class="btn btn-primary shadow mb-2 rounded">Krijo Produkt</button></a>
</div>

<div th:replace="fragments :: message" />

<div class="text-center">
<div class="mt-3 full-details d-flex justify-content-center">
		<table class="table table-bordered table-striped table-hover table-responsive-xl w-75 shadow p-3 mb-5 bg-white rounded">
			<thead class="table-info">
				<tr>
					<th>Id</th>
					<th>Foto</th>
					<th>Emri</th>
					<th>Marka</th>
					<th>Kategoria</th>
					<th>Aktivizimi</th>
					<th>Veprime</th>
				</tr>								
			</thead>
			<tbody>
				<tr th:each="product : ${listProducts}">
					<td>[[${product.id}]]</td>
					<td></td>
					<td>[[${product.name}]]</td>
					<td>[[${product.brand.name}]]</td>
					<td>[[${product.category.name}]]</td>
					<td>
						<div th:replace="fragments :: status(${product.enabled}, 'product', '/products/' + ${product.id})" />
					</td>

					<td>
						<div th:replace="fragments :: edit('product', '/products/edit/' + ${product.id})" />
						|
						<div th:replace="fragments :: delete('product', ${product.id}, '/products/delete/' + ${product.id}, true)" />				
					</td>					
				</tr>
			</tbody>
		</table>
	</div>
</div>
	
	<div th:replace="fragments :: footer"></div>
	
	<script th:src="@{/js/common_list.js}"></script>
<script type="text/javascript">
	moduleURL = "[[@{/products}]]";
</script>
</body>
</html>
