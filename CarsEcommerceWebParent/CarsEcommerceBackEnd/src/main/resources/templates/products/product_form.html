<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="fragments :: metaetj" />
</head>
<body>
<div class="container-fluid">
	<div th:replace="navigation :: menu"></div>
	
	<div class="shadow rounded">
	<div class="mt-4 font-weight-bold text-center text-info">
		<h2>[[${pageTitle}]]</h2>	
	</div>
	
	<form th:action="@{/products/save}" method="post" enctype="multipart/form-data" onsubmit="return checkUnique(this)"
		th:object="${product}">
		<input type="hidden" th:field="*{id}" />
	<div>
		<ul class="nav" id="myTab" role="tablist">
		  <li class="nav-item">
		    <a class="nav-link active shadow-sm bg-light rounded" data-toggle="tab" href="#overview" role="tab">Te pergjithshmet</a>
		  </li>
		  <li class="nav-item">
		    <a class="nav-link shadow-sm bg-light rounded" data-toggle="tab" href="#description" role="tab">Numrat OEM dhe Te tjere</a>
		  </li>
		  <li class="nav-item">
		    <a class="nav-link shadow-sm bg-light rounded" data-toggle="tab" href="#details" role="tab">Detajet</a>
		  </li>
		</ul>

		<div class="tab-content">
		  <div class="tab-pane active p-3" id="overview" role="tabpanel">
		  	<div th:replace="products/product_overview :: content"></div>
		  </div>
		  <div class="tab-pane" id="description" role="tabpanel">
		  	<div th:replace="products/product_oemothernumbers :: content"></div>
		  </div>
		  <div class="tab-pane" id="details" role="tabpanel">
		  	<div th:replace="products/product_details :: content"></div>
		  	
		  	<div class="d-flex justify-content-center mt-3">
		  		<input type="button" class="btn btn-secondary" value="Krijo detaj te ri"
		  			onclick="addNextDetailSection()" />
		  	</div>	
		  </div>
		</div>	
	</div>
	<div class=" mt-3 text-center">
		<input type="submit" value="Ruaj" class="btn btn-primary m-3 shadow rounded" />
		<input type="button" value="Anulo" class="btn btn-secondary shadow rounded" id="buttonCancel" />
	</div>
	</form>
	
	</div>

	<div th:replace="modal_fragment :: modal_dialog"></div>

	<div th:replace="fragments :: footer"></div>

</div>
<script type="text/javascript">
    MAX_FILE_SIZE = 502400; // 500KB
	moduleURL = "[[@{/products}]]";
	brandModuleURL = "[[@{/brands}]]";
	
	dropdownBrands = $("#brand");
	dropdownCategories = $("#category");

	$(document).ready(function() {
		
		dropdownBrands.change(function() {
			dropdownCategories.empty();
			getCategories();
		});	

		getCategories();
	});


	function getCategories() {
		brandId = dropdownBrands.val(); 
		url = brandModuleURL + "/" + brandId + "/categories";

		$.get(url, function(responseJson) {
			$.each(responseJson, function(index, category) {
				$("<option>").val(category.id).text(category.name).appendTo(dropdownCategories);
			});			
		});
	}
	
	function checkUnique(form) {
		productId = $("#id").val();
		productName = $("#name").val();

		csrfValue = $("input[name='_csrf']").val();

		url = "[[@{/products/check_unique}]]";

		params = {id: productId, name: productName, _csrf: csrfValue};

		$.post(url, params, function(response) {
			if (response == "OK") {
				form.submit();
			} else if (response == "Duplicate") {
				showWarningModal("Ekziston një produkt tjetër që ka emrin " + productName);	
			} else {
				showErrorModal("Përgjigje e panjohur nga serveri");
			}

		}).fail(function() {
			showErrorModal("Nuk mund të lidhej me serverin");
		});

		return false;
	}
</script>
<script th:src="@{/js/common_form.js}"></script>
<script th:src="@{/js/product_form_details.js}"></script>
</body>
</html>
