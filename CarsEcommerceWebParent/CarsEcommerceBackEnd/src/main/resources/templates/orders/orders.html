<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: metaetj" />
<body>

<div th:replace="navigation :: menu"></div>

<div th:replace="fragments :: search_form('/orders/page/1')" />

<div th:replace="fragments :: message" />

<div class="text-center">
<div class="mt-3 full-details d-flex justify-content-center">
		<table class="table table-bordered table-striped table-hover table-responsive-xl w-75 shadow p-3 mb-5 bg-white rounded">
			<thead class="table-info">
				<tr>
                    <th th:replace="fragments :: column_link('/orders', 'customer', 'Konsumatori', 'none')" />
					<th th:replace="fragments :: column_link('/orders', 'total', 'Totali', 'none')" />
					<th th:replace="fragments :: column_link('/orders', 'orderTime', 'Koha e Porosis', 'none')" />
					<th th:replace="fragments :: column_link('/orders', 'paymentMethod', 'Metoda e Pageses', 'none')" />
					<th th:replace="fragments :: column_link('/orders', 'status', 'Statusi', 'none')" />
					<th>Ndrysho Statusin</th>
					<th>Veprime</th>
				</tr>								
			</thead>
			<tbody>
				<tr th:each="order : ${listOrders}">
					<td><a class="linkCustomerDetail" th:href="@{'/customers/detail/' + ${order.customer.id}}"
							title="Shikoni detajet e kesaj porosie"
							>[[${order.customer.fullName}]]</a></td>
					<td>[[${order.total}]]</td>
					<td>[[${order.orderTime}]]</td>
					<td>[[${order.paymentMethod}]]</td>
					<td>[[${order.status}]]</td>
					<td><div th:replace="orders/order_status_fragment :: content(${order.processing}, 'PROCESSING', 'fa-spinner', 'Procesuar')"></div>
					    <div th:replace="orders/order_status_fragment :: content(${order.packaged}, 'PACKAGED', 'fa-people-carry', 'Paketuar')"></div>
					    <div th:replace="orders/order_status_fragment :: content(${order.refunded}, 'REFUNDED', 'fa-undo', 'E refuzuar')"></div>
					    <div th:replace="orders/order_status_fragment :: content(${order.paid}, 'PAID', 'fa-check', 'E paguar')"></div>
					</td>
					<td>
						<a class="linkOrderDetail" th:href="@{'/orders/detail/' + ${order.id}}"
							title="Shikoni detajet per kete porosi"
							>Detajet e Porosis</a>
						|
						<div th:replace="fragments :: delete('order', ${order.id}, '/orders/delete/' + ${order.id}, true)" />				
					</td>					
				</tr>
			</tbody>
		</table>
	</div>
</div>

    <div th:replace="fragments :: pagination('orders')"></div>
    
    <div class="modal fade text-center" id="confirmModal">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h4 class="modal-title">Update Confirmation</h4>
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
				
				<div class="modal-body">
					<span id="confirmText"></span>
				</div>
				
				<div class="modal-footer">
					<a class="btn btn-success" href="" id="yesButton">Yes</a>
					<button type="button" class="btn btn-danger" id="noButton" data-dismiss="modal">No</button>
				</div>
			</div>
		</div>
	</div>	
    
    <div class="modal fade" id="customerDetailModal">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
			</div>
		</div>
	</div>
	
	<div class="modal fade" id="orderDetailModal">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
			</div>
		</div>
	</div>
	
	<div th:replace="fragments :: footer"></div>
	
	<script th:src="@{/js/common_list.js}"></script>
<script type="text/javascript">
	moduleURL = "[[@{/orders}]]";
	
	var csrfHeaderName = "[[${_csrf.headerName}]]";
	var csrfValue = "[[${_csrf.token}]]";
	
	$(document).ready(function() {
		handleLinkViewCustomerDetails();
		handleLinkViewOrderDetails();
		handleLinkDeleteOrder();
	});
	
	function handleLinkDeleteOrder() {
		$(".link-delete").on("click", function(e) {
			e.preventDefault();
			showDeleteConfirmModal($(this), 'order');
		});		
	}
	
	function handleLinkViewCustomerDetails() {
		$(".linkCustomerDetail").on("click", function(e) {
			e.preventDefault();
			linkDetailURL = $(this).attr("href");
			$("#customerDetailModal").modal("show").find(".modal-content").load(linkDetailURL);
		});			
	}
	
	function handleLinkViewOrderDetails() {
		$(".linkOrderDetail").on("click", function(e) {
			e.preventDefault();
			linkDetailURL = $(this).attr("href");
			$("#orderDetailModal").modal("show").find(".modal-content").load(linkDetailURL);
		});		
	}
</script>

<script th:src="@{/js/orders_status.js}"></script>
</body>
</html>
